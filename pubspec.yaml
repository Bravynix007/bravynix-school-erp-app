name: bravynix_school_erp
description: BravyNix School ERP mobile app for Society Owners, Institution Admins, Teachers and Parents.
publish_to: 'none'

# versionName+versionCode. The API's version gate reads the name (API design 5.2).
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

dependencies:
  bloc: ^9.2.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Static weights cut from the variable font, SIL Open Font License; the licence sits beside them.
    # Static files let Flutter pick the nearest weight, so Bold Text and bold spans work.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-700.ttf
          weight: 700
